      <text x="470" y="197" fill="#1E293B" font-size="10.5" font-family="'Segoe UI', Arial, sans-serif" font-weight="600" text-anchor="middle">Asignar Responsable</text>
      <text x="470" y="211" fill="#1E293B" font-size="10.5" font-family="'Segoe UI', Arial, sans-serif" font-weight="600" text-anchor="middle">y Fecha Límite</text>
    </g>
  

          <g class="bpmn-node" id="node_p2_join" onclick="selectElement('p2_join')" style="cursor:pointer;">
            <polygon points="585,62 605,80 585,98 565,80" fill="#FEF9E7" stroke="#CA8A04" stroke-width="1.8"/>
