      <text x="732.5" y="331" fill="#1E293B" font-size="10.5" font-family="'Segoe UI', Arial, sans-serif" font-weight="600" text-anchor="middle">Prometida</text>
    </g>
  
          
    <g class="bpmn-task" id="node_p2_task_lib" onclick="selectElement('p2_task_lib')" filter="url(#task-shadow)" style="cursor: pointer;">
      <rect x="840" y="290" width="135" height="60" rx="6" fill="#F0F7FF" stroke="#2563EB" stroke-width="1.3"/>
      <g transform="translate(840, 290)">
        <g transform="translate(6, 6) scale(0.72)">
    <path d="M 4 14 L 4 7 C 4 6 5 6 5 7 L 5 13 M 5 7 C 5 5.5 6.5 5.5 6.5 7 L 6.5 13 M 6.5 7 C 6.5 5.8 8 5.8 8 7 L 8 13 M 8 8 C 8 7 9.5 7 9.5 8.5 L 9.5 14 C 9.5 16 4 16 3 13 L 2 10 C 1.5 9 2.5 8 3.5 9 L 4 10" fill="none" stroke="#0284C7" stroke-width="1.4" stroke-linejoin="round"/>
  </g>
        
      </g>
      <text x="907.5" y="317" fill="#1E293B" font-size="10.5" font-family="'Segoe UI', Arial, sans-serif" font-weight="600" text-anchor="middle">Gestionar Liberación</text>
      <text x="907.5" y="331" fill="#1E293B" font-size="10.5" font-family="'Segoe UI', Arial, sans-serif" font-weight="600" text-anchor="middle">en Faena</text>
    </g>
  
          
    <g class="bpmn-task" id="node_p2_task_ent" onclick="selectElement('p2_task_ent')" filter="url(#task-shadow)" style="cursor: pointer;">
