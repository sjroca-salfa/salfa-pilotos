    </g>
  
          
    <g class="bpmn-task" id="node_p2_task_asig" onclick="selectElement('p2_task_asig')" filter="url(#task-shadow)" style="cursor: pointer;">
      <rect x="405" y="170" width="130" height="60" rx="6" fill="#F0F7FF" stroke="#2563EB" stroke-width="1.3"/>
      <g transform="translate(405, 170)">
        <g transform="translate(6, 6) scale(0.72)">
    <circle cx="8" cy="5" r="3.6" fill="none" stroke="#0284C7" stroke-width="1.6"/>
