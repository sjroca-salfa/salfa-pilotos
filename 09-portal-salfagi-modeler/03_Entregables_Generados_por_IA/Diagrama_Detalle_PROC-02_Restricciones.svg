
    <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1460 535" width="1460" height="535" style="background:#FFFFFF; font-family:'Segoe UI', Arial, sans-serif;">
      
    <!-- Barra Roja Institucional BRASA (8mm) -->
    <rect x="0" y="0" width="1460" height="8" fill="#B01E24"/>

    <!-- Encabezado Corporativo Oficial SALFA MONTAJES -->
    <g transform="translate(20, 18)">
      <!-- Logo Corporativo -->
      <text x="0" y="24" fill="#15181B" font-size="22" font-weight="900" font-family="'Segoe UI', Arial, sans-serif">
        <tspan fill="#B01E24">SALFA</tspan>MONTAJES
      </text>
      <line x1="190" y1="4" x2="190" y2="34" stroke="#D1D5DB" stroke-width="1.2"/>
      
      <!-- Metadatos de Serie Normativa -->
      <text x="205" y="15" fill="#5A626A" font-size="10.5" font-family="'Segoe UI', Arial, sans-serif">SISTEMA DE GESTIÓN INTEGRADO — SERIE OPERACIONAL N5</text>
      <text x="205" y="32" fill="#15181B" font-size="12.5" font-weight="700" font-family="'Segoe UI', Arial, sans-serif">PROC-02: GESTIÓN Y LIBERACIÓN DE RESTRICCIONES (AS-IS)</text>

      <!-- Cajetín Normalizado de Control, Autoría y Auditoría -->
      <rect x="960" y="2" width="460" height="42" rx="3" fill="#FFFFFF" stroke="#D1D5DB" stroke-width="1"/>
      
      <!-- Fila 1 -->
      <text x="970" y="15" fill="#5A626A" font-size="8.5" font-weight="700" font-family="'Segoe UI', Arial, sans-serif">CÓDIGO:</text>
      <text x="1018" y="15" fill="#B01E24" font-size="9" font-weight="700" font-family="'Segoe UI', Arial, sans-serif">10000000-SAL-00000-DOC-DIA-00001</text>
      <text x="1230" y="15" fill="#5A626A" font-size="8.5" font-weight="700" font-family="'Segoe UI', Arial, sans-serif">ESTADO:</text>
      <text x="1280" y="15" fill="#2E7D32" font-size="9" font-weight="700" font-family="'Segoe UI', Arial, sans-serif">VIGENTE AS-IS</text>

      <!-- Fila 2 -->
      <text x="970" y="27" fill="#5A626A" font-size="8.5" font-weight="700" font-family="'Segoe UI', Arial, sans-serif">DOC RECTOR:</text>
      <text x="1042" y="27" fill="#15181B" font-size="9" font-weight="700" font-family="'Segoe UI', Arial, sans-serif">10000000-PRO-EST-001 (Rev. 0)</text>
      <text x="1230" y="27" fill="#5A626A" font-size="8.5" font-weight="700" font-family="'Segoe UI', Arial, sans-serif">REVISIÓN:</text>
      <text x="1288" y="27" fill="#15181B" font-size="9" font-weight="700" font-family="'Segoe UI', Arial, sans-serif">Rev. 0 (Auditoría 100%)</text>

      <!-- Fila 3: Autor Institucional -->
      <text x="970" y="39" fill="#5A626A" font-size="8.5" font-weight="700" font-family="'Segoe UI', Arial, sans-serif">AUTOR:</text>
      <text x="1012" y="39" fill="#15181B" font-size="9" font-weight="700" font-family="'Segoe UI', Arial, sans-serif">Sebastián Roca G. (+56993543447 | sjroca@salfamontajes.com)</text>
    </g>
  
      
    <defs>
      <!-- Marcador flecha sólida (Flujo de secuencia) -->
      <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
        <path d="M 0 1.5 L 10 5 L 0 8.5 z" fill="#1E293B"/>
      </marker>
      <!-- Marcador flecha abierta (Flujo de mensaje) -->
      <marker id="msg-arrow" viewBox="0 0 12 12" refX="11" refY="6" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
        <path d="M 1 2 L 11 6 L 1 10" fill="none" stroke="#475569" stroke-width="1.8"/>
      </marker>
      <!-- Filtro sombra suave -->
      <filter id="task-shadow" x="-5%" y="-5%" width="110%" height="115%">
        <feDropShadow dx="0" dy="1.5" stdDeviation="1.5" flood-color="#000000" flood-opacity="0.08"/>
      </filter>
    </defs>
  

      <g transform="translate(20, 90)">
        <g id="pool_proc2_detail">
          <!-- Borde exterior de la piscina -->
          <rect x="25" y="20" width="1370" height="360" fill="#FFFFFF" stroke="#334155" stroke-width="1.5" rx="2"/>

          <!-- Franja de título vertical -->
          <rect x="25" y="20" width="32" height="360" fill="#F1F5F9" stroke="#CBD5E1" stroke-width="1"/>
          <text x="-200" y="46" fill="#1E293B" font-size="11" font-weight="700" letter-spacing="0.5" text-anchor="middle" transform="rotate(-90)">PROC-02: Gestión y Liberación de Restricciones</text>

          <!-- Carriles -->
          <rect x="57" y="20" width="28" height="120" fill="#F8FAFC" stroke="#CBD5E1" stroke-width="1"/>
          <text x="-80" y="75" fill="#475569" font-size="9" font-weight="700" text-anchor="middle" transform="rotate(-90)">Identificador de la Restricción</text>
          <line x1="85" y1="140" x2="1395" y2="140" stroke="#CBD5E1" stroke-width="1"/>

          <rect x="57" y="140" width="28" height="120" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="1"/>
          <text x="-200" y="75" fill="#475569" font-size="9" font-weight="700" text-anchor="middle" transform="rotate(-90)">Administrador de Obra</text>
          <line x1="85" y1="260" x2="1395" y2="260" stroke="#CBD5E1" stroke-width="1"/>

          <rect x="57" y="260" width="28" height="120" fill="#F8FAFC" stroke="#CBD5E1" stroke-width="1"/>
          <text x="-320" y="75" fill="#475569" font-size="9" font-weight="700" text-anchor="middle" transform="rotate(-90)">Parte Responsable</text>

          <!-- Tareas y Nodos -->
          <g class="bpmn-node" id="node_p2_start_event" onclick="selectElement('p2_start_event')" style="cursor:pointer;">
            <circle cx="115" cy="80" r="17" fill="#DCFCE7" stroke="#16A34A" stroke-width="2"/>
            <text x="115" y="112" fill="#1E293B" font-size="9" font-weight="600" text-anchor="middle">Restricción</text>
            <text x="115" y="123" fill="#64748B" font-size="8.5" text-anchor="middle">Detectada</text>
          </g>

          
    <g class="bpmn-task" id="node_p2_task_reg" onclick="selectElement('p2_task_reg')" filter="url(#task-shadow)" style="cursor: pointer;">
      <rect x="175" y="50" width="125" height="60" rx="6" fill="#F0F7FF" stroke="#2563EB" stroke-width="1.3"/>
      <g transform="translate(175, 50)">
        <g transform="translate(6, 6) scale(0.72)">
    <circle cx="8" cy="5" r="3.6" fill="none" stroke="#0284C7" stroke-width="1.6"/>
    <path d="M 2 15 C 2 10.8 5 9.4 8 9.4 C 11 9.4 14 10.8 14 15" fill="none" stroke="#0284C7" stroke-width="1.6"/>
  </g>
        
      </g>
      <text x="237.5" y="77" fill="#1E293B" font-size="10.5" font-family="'Segoe UI', Arial, sans-serif" font-weight="600" text-anchor="middle">Registrar Restricción</text>
      <text x="237.5" y="91" fill="#1E293B" font-size="10.5" font-family="'Segoe UI', Arial, sans-serif" font-weight="600" text-anchor="middle">en OPC</text>
    </g>
  

          <g class="bpmn-node" id="node_p2_fork" onclick="selectElement('p2_fork')" style="cursor:pointer;">
